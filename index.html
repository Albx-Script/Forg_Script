<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScriptForge.lua — Kho lưu trữ & chia sẻ script Luau cho Roblox</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#0A0E17', surface: '#10141F', surface2: '#151A28', edge: '#212838', edgesoft: '#1A2030',
          hi: '#E8EBF3', mid: '#99A2B8', low: '#5C6478', nblue: '#45D0FF', npurple: '#B48CFF', ngreen: '#3DDC97', norange: '#F2A65A',
        },
        fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] }
      },
    },
  };
</script>
<style>
  :root { color-scheme: dark; }
  body { background-color: #0A0E17; color: #E8EBF3; font-family: 'Inter', sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .code-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .code-scroll::-webkit-scrollbar-thumb { background-color: #212838; border-radius: 4px; }
</style>
</head>

<body class="bg-base text-hi antialiased">

<!-- HEADER -->
<header class="sticky top-0 z-40 border-b border-edge bg-base/90 backdrop-blur-md">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
    
    <a href="#" class="flex items-center gap-2 shrink-0">
      <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-nblue to-npurple text-base font-mono font-bold grid place-items-center">{ }</span>
      <span class="font-mono font-bold text-lg">ScriptForge<span class="text-nblue">.lua</span></span>
    </a>

    <!-- Thanh tìm kiếm -->
    <div class="flex-1 max-w-md hidden md:block">
      <input id="searchInput" type="text" placeholder="Tìm script, tên game, tác giả..."
        class="w-full bg-surface border border-edge rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-nblue" />
    </div>

    <!-- Auth + Upload -->
    <div class="flex items-center gap-2">
      <div id="authArea" class="flex items-center gap-2">
        <!-- Nút Google Auth -->
        <button id="googleLoginBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-edge bg-surface text-xs hover:bg-surface2 transition">
          <svg class="w-3.5 h-3.5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 27 36 24 36c-5.2 0-9.5-3.1-11.3-7.5l-6.5 5C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.9 36 44 30.6 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
          Google
        </button>
        <!-- Nút Apple Auth -->
        <button id="appleLoginBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-edge bg-surface text-xs hover:bg-surface2 transition">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M16.3 1c.1 1.2-.4 2.4-1.1 3.3-.7.9-1.9 1.6-3.1 1.5-.1-1.2.5-2.4 1.2-3.2C14 1.7 15.2 1 16.3 1zM20.7 17.2c-.5 1.1-.7 1.6-1.4 2.6-.9 1.4-2.2 3.1-3.8 3.1-1.4 0-1.8-.9-3.7-.9s-2.4.9-3.7.9c-1.6 0-2.8-1.5-3.7-2.9-2.6-3.9-2.9-8.5-1.3-10.9 1.1-1.7 2.9-2.8 4.6-2.8 1.7 0 2.8 1 4.2 1 1.3 0 2.2-1 4.2-1 1.5 0 3.1.8 4.2 2.3-3.7 2-3.1 7.3.4 8.6z"/></svg>
          Apple
        </button>
      </div>

      <div id="userArea" class="hidden items-center gap-2">
        <span id="userName" class="text-xs text-mid font-mono"></span>
        <button id="logoutBtn" class="text-xs text-low hover:text-hi">Đăng xuất</button>
      </div>

      <button id="openUploadBtn" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-nblue to-npurple text-base text-xs font-semibold hover:brightness-110">
        + Tải lên
      </button>
    </div>

  </div>
</header>

<!-- MAIN CONTENT -->
<main class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex items-center justify-between mb-6">
    <h1 class="font-mono text-xl font-bold">Script Cộng Đồng Roblox</h1>
    <span id="statusText" class="text-xs font-mono text-nblue animate-pulse">Đang tải script từ mạng...</span>
  </div>

  <!-- Lưới hiển thị Script -->
  <div id="scriptGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
</main>

<!-- MODAL XEM CODE & ANH DEMO -->
<div id="codeViewerModal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-surface border border-edge rounded-2xl overflow-hidden flex flex-col max-h-[90vh]">
    <div class="p-4 border-b border-edge flex justify-between items-center bg-surface2">
      <div>
        <h2 id="viewerTitle" class="font-bold text-hi"></h2>
        <p id="viewerGame" class="text-xs font-mono text-nblue"></p>
      </div>
      <button id="closeViewerBtn" class="text-mid hover:text-hi">✕</button>
    </div>
    
    <div class="p-4 overflow-y-auto space-y-4 code-scroll">
      <!-- Vùng hiển thị ảnh thật -->
      <div id="viewerImageWrapper" class="hidden">
        <img id="viewerImage" src="" class="max-h-56 w-auto mx-auto rounded-lg border border-edge object-cover" />
      </div>
      <p id="viewerDescription" class="text-sm text-mid"></p>
      <pre class="bg-base p-3 rounded-lg text-xs font-mono text-hi overflow-x-auto"><code id="viewerCode"></code></pre>
    </div>

    <div class="p-3 border-t border-edge bg-surface2 flex justify-end">
      <button id="copyCodeBtn" class="px-4 py-2 rounded-lg bg-nblue text-base text-xs font-bold hover:brightness-110">Sao chép Code</button>
    </div>
  </div>
</div>

<!-- MODAL UPLOAD SCRIPT (CÓ CHỨC NĂNG TẢI ẢNH THẬT) -->
<div id="uploadModal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <form id="uploadForm" class="w-full max-w-lg bg-surface border border-edge rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center border-b border-edge pb-3">
      <h2 class="font-bold">Tải lên Script Mới</h2>
      <button type="button" id="closeUploadBtn" class="text-mid">✕</button>
    </div>

    <div>
      <label class="block text-xs text-mid mb-1">Tiêu đề Script</label>
      <input id="uploadTitleInput" required type="text" class="w-full bg-base border border-edge rounded px-3 py-1.5 text-sm" placeholder="VD: Blox Fruits Auto Farm" />
    </div>

    <div>
      <label class="block text-xs text-mid mb-1">Tên Game</label>
      <input id="uploadGameInput" required type="text" class="w-full bg-base border border-edge rounded px-3 py-1.5 text-sm" placeholder="VD: Blox Fruits" />
    </div>

    <!-- KHUNG UPLOAD ẢNH THẬT -->
    <div>
      <label class="block text-xs text-mid mb-1">Ảnh Demo/Screenshot (Chọn từ máy)</label>
      <div class="border-2 border-dashed border-edge rounded-lg p-4 text-center relative bg-base/50">
        <input type="file" id="uploadImageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
        <div id="uploadImagePlaceholder">
          <p class="text-xs text-mid">Nhấp vào đây để chọn tệp ảnh</p>
          <p class="text-[10px] text-low">PNG, JPG, WEBP</p>
        </div>
        <img id="uploadImagePreview" src="" class="hidden max-h-36 mx-auto rounded border border-edge" />
      </div>
    </div>

    <div>
      <label class="block text-xs text-mid mb-1">Mã Luau Code</label>
      <textarea id="uploadCodeInput" required rows="5" class="w-full bg-base border border-edge rounded px-3 py-1.5 text-xs font-mono" placeholder="-- Dán script luau vào đây"></textarea>
    </div>

    <div class="flex justify-end gap-2 pt-2 border-t border-edge">
      <button type="button" id="cancelUploadBtn" class="px-4 py-1.5 rounded text-xs text-mid">Hủy</button>
      <button type="submit" class="px-4 py-1.5 rounded bg-gradient-to-r from-nblue to-npurple text-base text-xs font-bold">Đăng tải</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  let scripts = [];
  let uploadedBase64Image = '';

  // 1. TỰ ĐỘNG CÀO/FETCH SCRIPT TỪ CỘNG ĐỒNG SCRIPTBLOX
  async function fetchCommunityScripts() {
    const statusText = document.getElementById('statusText');
    try {
      // Gọi API công khai của ScriptBlox
      const res = await fetch('https://scriptblox.com/api/script/fetch?page=1');
      const data = await res.json();

      if (data && data.result && data.result.scripts) {
        const fetchedData = data.result.scripts.map(s => {
          // Lấy đường dẫn ảnh game thật
          let img = '';
          if (s.game && s.game.imageUrl) {
            img = s.game.imageUrl.startswith('http') ? s.game.imageUrl : `https://scriptblox.com${s.game.imageUrl}`;
          }
          return {
            id: s._id,
            title: s.title,
            game: s.game ? s.game.name : 'Universal',
            author: s.owner ? s.owner.username : 'Community',
            description: s.features || 'Script được tự động đồng bộ từ cộng đồng.',
            code: s.script || 'loadstring(game:HttpGet("https://raw.githubusercontent.com/..."))()',
            imageUrl: img
          };
        });

        scripts = [...fetchedData];
        renderScripts(scripts);
        statusText.textContent = `✓ Đã cập nhật ${scripts.length} script từ mạng`;
        statusText.classList.remove('animate-pulse');
      }
    } catch (err) {
      console.error('Lỗi khi cào script:', err);
      statusText.textContent = 'Không thể tự động cập nhật script từ mạng (CORS Block).';
    }
  }

  // 2. RENDER CARD SCRIPT
  function renderCard(s) {
    return `
    <article data-id="${s.id}" class="script-card flex flex-col justify-between rounded-xl border border-edge bg-surface hover:border-nblue/50 transition p-3.5 cursor-pointer">
      <div>
        ${s.imageUrl ? `<img src="${s.imageUrl}" class="w-full h-32 object-cover rounded-lg mb-2.5 border border-edgesoft" />` : ''}
        <p class="text-[11px] font-mono text-nblue truncate">${s.game}</p>
        <h3 class="font-bold text-sm text-hi line-clamp-1 mt-0.5">${s.title}</h3>
        <p class="text-xs text-mid line-clamp-2 mt-1 leading-relaxed">${s.description}</p>
      </div>
      <div class="mt-3 pt-2 border-t border-edgesoft flex justify-between items-center text-[11px] text-low">
        <span>Tác giả: <strong class="text-mid">${s.author}</strong></span>
      </div>
    </article>`;
  }

  function renderScripts(list) {
    const grid = document.getElementById('scriptGrid');
    grid.innerHTML = list.map(renderCard).join('');
  }

  // 3. XỬ LÝ UPLOAD ẢNH THẬT TRONG MÁY
  const uploadImageInput = document.getElementById('uploadImageInput');
  const uploadImagePreview = document.getElementById('uploadImagePreview');
  const uploadImagePlaceholder = document.getElementById('uploadImagePlaceholder');

  uploadImageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        uploadedBase64Image = evt.target.result;
        uploadImagePreview.src = uploadedBase64Image;
        uploadImagePreview.classList.remove('hidden');
        uploadImagePlaceholder.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }
  });

  // 4. XEM CHI TIẾT SCRIPT
  document.getElementById('scriptGrid').addEventListener('click', (e) => {
    const card = e.target.closest('.script-card');
    if (!card) return;
    const s = scripts.find(x => x.id == card.dataset.id);
    if (!s) return;

    document.getElementById('viewerTitle').textContent = s.title;
    document.getElementById('viewerGame').textContent = s.game;
    document.getElementById('viewerDescription').textContent = s.description;
    document.getElementById('viewerCode').textContent = s.code;

    const imgWrapper = document.getElementById('viewerImageWrapper');
    const imgEl = document.getElementById('viewerImage');
    if (s.imageUrl) {
      imgEl.src = s.imageUrl;
      imgWrapper.classList.remove('hidden');
    } else {
      imgWrapper.classList.add('hidden');
    }

    document.getElementById('codeViewerModal').classList.remove('hidden');
  });

  document.getElementById('closeViewerBtn').addEventListener('click', () => {
    document.getElementById('codeViewerModal').classList.add('hidden');
  });

  // 5. NÚT SAO CHÉP CODE
  document.getElementById('copyCodeBtn').addEventListener('click', () => {
    const code = document.getElementById('viewerCode').textContent;
    navigator.clipboard.writeText(code);
    alert('Đã sao chép Script!');
  });

  // 6. XỬ LÝ SUBMIT SCRIPT MỚI
  document.getElementById('uploadForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const newScript = {
      id: Date.now(),
      title: document.getElementById('uploadTitleInput').value,
      game: document.getElementById('uploadGameInput').value,
      author: 'User',
      description: 'Script do bạn tải lên từ thiết bị.',
      code: document.getElementById('uploadCodeInput').value,
      imageUrl: uploadedBase64Image
    };

    scripts.unshift(newScript);
    renderScripts(scripts);

    // Reset Form
    document.getElementById('uploadForm').reset();
    uploadImagePreview.classList.add('hidden');
    uploadImagePlaceholder.classList.remove('hidden');
    uploadedBase64Image = '';
    document.getElementById('uploadModal').classList.add('hidden');
  });

  // Đóng/Mở Modal Upload
  document.getElementById('openUploadBtn').addEventListener('click', () => document.getElementById('uploadModal').classList.remove('hidden'));
  document.getElementById('closeUploadBtn').addEventListener('click', () => document.getElementById('uploadModal').classList.add('hidden'));
  document.getElementById('cancelUploadBtn').addEventListener('click', () => document.getElementById('uploadModal').classList.add('hidden'));

  // 7. GIẢ LẬP AUTH GOOGLE & APPLE
  document.getElementById('googleLoginBtn').addEventListener('click', () => loginUser('Minh Tran (Google)'));
  document.getElementById('appleLoginBtn').addEventListener('click', () => loginUser('Minh Tran (Apple)'));
  document.getElementById('logoutBtn').addEventListener('click', () => {
    document.getElementById('authArea').classList.remove('hidden');
    document.getElementById('userArea').classList.add('hidden');
  });

  function loginUser(name) {
    document.getElementById('authArea').classList.add('hidden');
    document.getElementById('userArea').classList.remove('hidden');
    document.getElementById('userArea').classList.add('flex');
    document.getElementById('userName').textContent = name;
  }

  // Khởi chạy lấy script từ mạng
  fetchCommunityScripts();
})();
</script>
</body>
                                                                                                 </html>
